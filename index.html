<!DOCTYPE html>
<html lang="pt-br" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio AG3D - DevLinks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="container">
      <div id="profile">
        <img
          src="https://github.com/vitorhugomarcal.png"
          alt="Foto de perfil do Studio AG3D"
        />
        <h1>Studio AG3D</h1>
        <p>@studio.ag3d</p>
      </div>
      <div id="switch" onclick="toggleMode()">
        <button></button>
        <span></span>
      </div>
      <ul>
        <li>
          <a href="https://instagram.com/studio.ag3d" target="_blank">Instagram</a>
        </li>
        <li>
          <a href="#" id="pix-button" onclick="copyPix(event)">Pix Copia e Cola</a>
        </li>
      </ul>
      <div id="social-links">
        <a href="https://instagram.com/studio.ag3d" target="_blank">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
      </div>

      <footer>
        Feito com ♥️ por <a href="https://instagram.com/studio.ag3d" target="_blank">@studio.ag3d</a>
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>

    <script src="./scripts.js"></script>
  </body>
</html>
